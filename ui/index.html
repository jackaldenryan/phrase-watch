<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PhraseWatch</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div>
        <h1>PhraseWatch</h1>
        <p class="sub">Fully local. Audio never leaves this Mac.</p>
      </div>
      <div id="status-pill" class="pill paused">Paused</div>
    </header>

    <section class="card">
      <p id="model-note" class="note">Checking models…</p>
      <progress id="model-progress" max="100" value="0" hidden></progress>
      <div class="row">
        <button id="listen-btn" type="button" disabled>Start listening</button>
        <button id="update-btn" type="button" class="ghost">Check for updates</button>
      </div>
    </section>

    <section class="card">
      <h2>Phrases</h2>
      <p class="hint">One per line. Exact / near-exact matches only.</p>
      <textarea id="phrases" rows="6"></textarea>
      <button id="save-phrases" type="button">Save phrases</button>
    </section>

    <section class="card stats-card">
      <div class="stats-head">
        <h2>Over time</h2>
        <div class="total">
          <span class="hint" id="range-label">Today</span>
          <strong id="stats-total">0</strong>
        </div>
      </div>
      <div class="controls">
        <label class="control">
          <span>Bucket</span>
          <select id="bucket">
            <option value="15m">15 minutes</option>
            <option value="1h" selected>1 hour</option>
            <option value="1d">1 day</option>
            <option value="1w">1 week</option>
            <option value="1mo">1 month</option>
          </select>
        </label>
        <label class="control">
          <span>Date range</span>
          <select id="preset">
            <option value="today" selected>Today</option>
            <option value="wtd">Week to date</option>
            <option value="mtd">Month to date</option>
            <option value="ytd">Year to date</option>
            <option value="24h">24 hours</option>
            <option value="1w">1 week</option>
            <option value="2w">2 weeks</option>
            <option value="1mo">1 month</option>
            <option value="6mo">6 months</option>
            <option value="1y">1 year</option>
            <option value="all">All time</option>
            <option value="custom">Custom…</option>
          </select>
        </label>
        <label class="control" id="custom-range" hidden>
          <span>From / to</span>
          <span class="dates">
            <input type="date" id="from-date" />
            <input type="date" id="to-date" />
          </span>
        </label>
        <label class="control">
          <span>Phrase</span>
          <select id="phrase-filter">
            <option value="">All phrases</option>
          </select>
        </label>
      </div>
      <p id="stats-banner" class="banner" hidden></p>
      <div class="chart-wrap">
        <svg id="chart" viewBox="0 0 640 220" preserveAspectRatio="none"></svg>
        <ul id="legend"></ul>
      </div>
      <ul id="breakdown"></ul>
    </section>

    <section class="card">
      <h2>Recent hits</h2>
      <ul id="hits"></ul>
    </section>

    <script type="module" src="main.js"></script>
  </body>
</html>
